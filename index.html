<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="format-detection" content="telephone=no">
<title>合肥市中心图书馆 · 历史数据分享</title>
<style>
:root{--primary:#3b82f6;--primary-dark:#1e40af;--bg:#f0f4f8;--card:#fff;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;--border:#e2e8f0;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.app{max-width:1200px;margin:0 auto;padding:12px}
.header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:var(--radius);padding:18px 20px;margin-bottom:12px;box-shadow:0 8px 30px rgba(37,99,235,.25)}
.header h1{font-size:18px;font-weight:700}
.header .sub{margin-top:6px;font-size:12px;opacity:.85}
.badge{display:inline-block;font-size:11px;background:rgba(255,255,255,.18);padding:2px 10px;border-radius:6px;margin-right:8px;font-weight:600}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);padding:10px 12px;border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px}
.toolbar label{font-size:12px;font-weight:600;color:var(--text2)}
.toolbar input{padding:6px 10px;border:1.5px solid #e5e7eb;border-radius:7px;font-size:13px;min-width:0}
.toolbar .sp{flex:1}
.btn{padding:6px 14px;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;background:#f1f5f9;color:var(--text)}
.btn:hover{background:#e2e8f0}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.summary-card{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-radius:10px;padding:10px 14px;border-left:4px solid var(--primary)}
.summary-card.green{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-left-color:#10b981}
.summary-card.orange{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-left-color:#f59e0b}
.summary-card.purple{background:linear-gradient(135deg,#f5f3ff,#ede9fe);border-left-color:#8b5cf6}
.s-label{font-size:11px;color:var(--text2);font-weight:600}
.s-value{font-size:18px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.s-sub{font-size:11px;color:var(--text2);margin-top:2px}
.card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:12px;border:1px solid var(--border)}
.card-title{font-size:14px;font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid #f1f5f9}
.table-wrap{overflow:auto;border-radius:8px;border:1px solid var(--border);max-height:560px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{background:#f8fafc;position:sticky;top:0;z-index:1}
th{padding:7px 9px;font-weight:700;color:var(--text2);border-bottom:2px solid var(--border);white-space:nowrap;text-align:center}
td{padding:6px 9px;border-bottom:1px solid #f1f5f9;white-space:nowrap;text-align:center}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f8faff}
tbody tr:active{background:#eff6ff}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.report{background:#f9fafb;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;line-height:1.9;white-space:pre-wrap;max-height:300px;overflow:auto}
.foot{text-align:center;font-size:11px;color:var(--text3);margin:12px 0}
/* 手机卡片列表 */
.mlist{display:none}
.mcard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer;transition:background .15s}
.mcard:active{background:#f0f6ff}
.mcard .top{display:flex;align-items:center;justify-content:space-between}
.mcard .date{font-size:15px;font-weight:700}
.mcard .wk{font-size:11px;color:var(--text3);font-weight:600;margin-left:6px}
.mcard .closed{display:inline-block;font-size:10px;color:#ef4444;background:#fef2f2;padding:1px 6px;border-radius:4px;margin-left:6px}
.mcard .grids{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.mcard .g{background:#f8fafc;border-radius:6px;padding:6px}
.mcard .g b{font-size:13px;font-variant-numeric:tabular-nums;display:block}
.mcard .g span{font-size:10px;color:var(--text3)}
.mcard .more{margin-top:8px;font-size:11px;color:var(--primary);text-align:center}
/* 详情弹层 */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:82vh;overflow:auto;padding:16px 18px 24px;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .bar{width:36px;height:4px;border-radius:2px;background:#e2e8f0;margin:0 auto 12px}
.sheet h3{font-size:15px;margin-bottom:10px}
.sheet .kv{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.sheet .kv div{background:#f8fafc;border-radius:7px;padding:7px 10px}
.sheet .kv b{display:block;font-size:12px;font-variant-numeric:tabular-nums}
.sheet .kv span{font-size:10px;color:var(--text3)}
.sheet .close{width:100%;margin-top:12px;padding:10px;border:none;border-radius:9px;background:#1e40af;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.sheet .rep{margin-top:10px;font-size:12px;line-height:1.8;white-space:pre-wrap;background:#f9fafb;border-radius:8px;padding:10px;color:#334155}
@media (max-width:768px){
  .app{padding:8px}
  .header h1{font-size:16px}
  table,.table-wrap{display:none}
  .mlist{display:block}
  .summary-grid{grid-template-columns:repeat(2,1fr)}
  .toolbar input[type=date]{flex:1;min-width:0}
}
@media print{.toolbar,.foot,.mlist{display:none}body{background:#fff}table,.table-wrap{display:block}.overlay{display:none!important}}
</style>
</head>

  r+='1.累计总客流 '+(d.cumulativeTotal||0)+' 人次，2026年当年累计客流 '+(d.ytdTotal||0)+' 人次；\n';
  r+='2.累计借阅证办理 '+(d.cardCumulative||0)+' 个；\n';
  r+='3.累计借还书：借出 '+(d.borrowCumulative||0)+' 本，还回 '+(d.returnCumulative||0)+' 本；\n';
  r+='4.馆方账号累计粉丝量 '+(d.totalFans||0)+' 人。';
  return r;
}
function showDetail(d){
  $('shTitle').textContent=d.date+'（'+wd(d.date)+' · 第'+(d.dayNumber||'?')+'天）';
  $('shKv').innerHTML=
    '<div><b>'+f(d.dailyGrandTotal)+'</b><span>当日总客流</span></div>'+
    '<div><b>'+f(d.visitorTotal)+'</b><span>进馆客流（二楼 '+f(d.floor2)+' / 三楼 '+f(d.floor3)+' / 一楼+24h '+f((d.floor1||0)+(d.hours24||0))+'）</span></div>'+
    '<div><b>'+f(d.commercialTotal)+'</b><span>商业客流</span></div>'+
    '<div><b>'+f(d.cardDaily)+'</b><span>当日办证</span></div>'+
    '<div><b>'+f(d.borrowDaily)+'</b><span>当日借书</span></div>'+
    '<div><b>'+f(d.returnDaily)+'</b><span>当日还书</span></div>'+
    '<div><b>'+f(d.borrowCumulative)+'</b><span>累计借书</span></div>'+
    '<div><b>'+f(d.returnCumulative)+'</b><span>累计还书</span></div>'+
    '<div><b>'+f(d.ytdTotal)+'</b><span>2026累计客流</span></div>'+
    '<div><b>'+f(d.cumulativeTotal)+'</b><span>开馆累计客流</span></div>'+
    '<div><b>'+f(d.cardCumulative)+'</b><span>累计办证</span></div>'+
    '<div><b>'+f(d.totalFans)+'</b><span>累计粉丝</span></div>';
  $('shRep').textContent=repText(d);
  $('overlay').classList.add('show');
}
function closeSheet(){$('overlay').classList.remove('show')}
$('overlay').addEventListener('click',function(e){if(e.target===$('overlay'))closeSheet()});
function render(){
  var s=$('fStart').value,e=$('fEnd').value,q=$('fSearch').value.trim();
  cur=ALL.filter(function(x){
    if(s&&x.date<s)return false;
    if(e&&x.date>e)return false;
    if(q&&x.date.indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return b.date.localeCompare(a.date)});
  $('cnt').textContent=cur.length;
  var tb=$('tbody');tb.innerHTML='';
  var ml=$('mlist');ml.innerHTML='';
  $('repCard').style.display='none';
  if(!cur.length){$('sumGrid').innerHTML='';$('rangeGrid').innerHTML='';$('rRange').textContent='无数据';return}
  var d0=cur[0];
  var tv=0,tg=0,tb2=0,tr2=0,tc=0;
  for(var i=0;i<cur.length;i++){tv+=cur[i].visitorTotal||0;tg+=cur[i].dailyGrandTotal||0;tb2+=cur[i].borrowDaily||0;tr2+=cur[i].returnDaily||0;tc+=cur[i].cardDaily||0}
  $('sumGrid').innerHTML=
    '<div class="summary-card"><div class="s-label">最新日期</div><div class="s-value" style="font-size:14px">'+d0.date+'</div><div class="s-sub">'+wd(d0.date)+' · 第'+(d0.dayNumber||'?')+'天</div></div>'+
    '<div class="summary-card green"><div class="s-label">当日总客流</div><div class="s-value">'+f(d0.dailyGrandTotal)+'</div><div class="s-sub">进馆 '+f(d0.visitorTotal)+' · 商业 '+f(d0.commercialTotal)+'</div></div>'+
    '<div class="summary-card orange"><div class="s-label">当日借还书</div><div class="s-value">'+f((d0.borrowDaily||0)+(d0.returnDaily||0))+'</div><div class="s-sub">借 '+f(d0.borrowDaily)+' · 还 '+f(d0.returnDaily)+'</div></div>'+
    '<div class="summary-card purple"><div class="s-label">累计总客流</div><div class="s-value">'+f(d0.cumulativeTotal)+'</div><div class="s-sub">2026年累计 '+f(d0.ytdTotal)+'</div></div>'+
    '<div class="summary-card"><div class="s-label">显示记录</div><div class="s-value">'+cur.length+'</div><div class="s-sub">期间客流 '+f(tg)+'</div></div>'+
    '<div class="summary-card green"><div class="s-label">期间办证</div><div class="s-value">'+f(tc)+'</div><div class="s-sub">借 '+f(tb2)+' · 还 '+f(tr2)+'</div></div>';
  // ---- 区间累计汇总（按所选日期范围累加） ----
  var rd=cur.slice().sort(function(a,b){return a.date.localeCompare(b.date)});
  if(rd.length){
    var days=rd.length,rs1=0,rs2=0,rs3=0,rs4=0,rs5=0,rs6=0,rs7=0;
    for(var k=0;k<rd.length;k++){var x=rd[k];rs1+=x.dailyGrandTotal||0;rs2+=x.visitorTotal||0;rs3+=x.commercialTotal||0;rs4+=x.cardDaily||0;rs5+=x.borrowDaily||0;rs6+=x.returnDaily||0;rs7+=x.newFans||0}
    var r0=rd[0],r1=rd[rd.length-1];
    $('rRange').textContent=r0.date+' ~ '+r1.date+'（'+days+'天）';
    $('rangeGrid').innerHTML=
      '<div class="summary-card"><div class="s-label">区间天数</div><div class="s-value">'+days+'</div><div class="s-sub">'+r0.date+' ~ '+r1.date+'</div></div>'+
      '<div class="summary-card green"><div class="s-label">总客流合计</div><div class="s-value">'+f(rs1)+'</div><div class="s-sub">日均 '+f(Math.round(rs1/days))+'</div></div>'+
      '<div class="summary-card"><div class="s-label">进馆客流合计</div><div class="s-value">'+f(rs2)+'</div><div class="s-sub">日均 '+f(Math.round(rs2/days))+'</div></div>'+
      '<div class="summary-card orange"><div class="s-label">商业客流合计</div><div class="s-value">'+f(rs3)+'</div><div class="s-sub">日均 '+f(Math.round(rs3/days))+'</div></div>'+
      '<div class="summary-card"><div class="s-label">办证合计</div><div class="s-value">'+f(rs4)+'</div><div class="s-sub">日均 '+f(Math.round(rs4/days))+'</div></div>'+
      '<div class="summary-card purple"><div class="s-label">借书合计</div><div class="s-value">'+f(rs5)+'</div><div class="s-sub">日均 '+f(Math.round(rs5/days))+'</div></div>'+
      '<div class="summary-card"><div class="s-label">还书合计</div><div class="s-value">'+f(rs6)+'</div><div class="s-sub">日均 '+f(Math.round(rs6/days))+'</div></div>'+
      '<div class="summary-card orange"><div class="s-label">新增粉丝合计</div><div class="s-value">'+f(rs7)+'</div><div class="s-sub">区间内累计</div></div>'+
      '<div class="summary-card purple"><div class="s-label">开馆累计客流</div><div class="s-value">'+f(r1.cumulativeTotal)+'</div><div class="s-sub">2026年累计 '+f(r1.ytdTotal)+'</div></div>'+
      '<div class="summary-card green"><div class="s-label">开馆累计借书</div><div class="s-value">'+f(r1.borrowCumulative)+'</div><div class="s-sub">累计还书 '+f(r1.returnCumulative)+'</div></div>';
  }
  for(var j=0;j<cur.length;j++){
    (function(d){
      var wk=wd(d.date),closed=(wk==='周一'?'<span class="closed">闭馆</span>':'');
      var tr=document.createElement('tr');
      tr.innerHTML='<td style="font-weight:600">'+d.date+'</td><td>'+wk+closed+'</td><td>'+(d.dayNumber||'—')+'</td><td class="num">'+f(d.dailyGrandTotal)+'</td><td class="num">'+f(d.visitorTotal)+'</td><td class="num">'+f(d.commercialTotal)+'</td><td class="num">'+f(d.cardDaily)+'</td><td class="num">'+f(d.borrowDaily)+'</td><td class="num">'+f(d.returnDaily)+'</td><td class="num">'+f(d.borrowCumulative)+'</td><td class="num">'+f(d.returnCumulative)+'</td><td class="num">'+f(d.ytdTotal)+'</td><td class="num">'+f(d.cumulativeTotal)+'</td>';
      tr.onclick=function(){showDetail(d)};
      tb.appendChild(tr);
      var mc=document.createElement('div');
      mc.className='mcard';
      mc.innerHTML='<div class="top"><div><span class="date">'+d.date+'</span><span class="wk">'+wk+'</span>'+closed+'</div><div style="font-size:11px;color:var(--text3)">第'+(d.dayNumber||'?')+'天</div></div>'+
        '<div class="grids">'+
        '<div class="g"><b>'+f(d.dailyGrandTotal)+'</b><span>总客流</span></div>'+
        '<div class="g"><b>'+f(d.visitorTotal)+'</b><span>进馆</span></div>'+
        '<div class="g"><b>'+f(d.commercialTotal)+'</b><span>商业</span></div>'+
        '<div class="g"><b>'+f(d.cardDaily)+'</b><span>办证</span></div>'+
        '<div class="g"><b>'+f(d.borrowDaily)+'</b><span>借书</span></div>'+
        '<div class="g"><b>'+f(d.returnDaily)+'</b><span>还书</span></div>'+
        '</div><div class="more">点击查看全部字段与当日播报 ›</div>';
      mc.onclick=function(){showDetail(d)};
      ml.appendChild(mc);
    })(cur[j]);
  }
}
$('fStart').addEventListener('change',render);
$('fEnd').addEventListener('change',render);
$('fSearch').addEventListener('input',render);
render();
</script>
</body>
</html>
